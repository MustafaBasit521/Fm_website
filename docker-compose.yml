# Local development database ONLY. Production/staging use Supabase-hosted PostgreSQL.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crochet
      POSTGRES_PASSWORD: crochet_dev_password
      POSTGRES_DB: crochet
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crochet -d crochet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
